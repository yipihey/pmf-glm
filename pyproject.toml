[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmf-reference"
version = "0.1.0"
description = "Independent CPU PMF reference models and production TSV diagnostics"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "matplotlib>=3.8", "Pillow>=9.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pmf-reference = "tools.reference.run_reference:main"
pmf-matched-scenario = "tools.reference.matched_scenario:main"
pmf-analyze = "tools.analysis.analyze_production:main"
pmf-compare-nonlinear = "tools.reference.nonlinear_comparison:main"
pmf-compare-solvers = "tools.reference.compare_solvers:main"

[tool.setuptools.packages.find]
include = ["tools.reference*", "tools.analysis*"]
namespaces = true

[tool.setuptools.package-data]
"tools.reference" = ["provenance.json"]

[tool.pytest.ini_options]
testpaths = ["test/python"]
pythonpath = ["."]
